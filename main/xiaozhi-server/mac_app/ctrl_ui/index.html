<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vibi Ctrl</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--mut:#6e6e73;--line:#e5e5ea;--card:#f5f5f7;--ok:#1a9f4b;--bad:#d92d20;--warn:#b54708;--acc:#0a63d6}
@media(prefers-color-scheme:dark){:root{--bg:#161618;--fg:#f2f2f4;--mut:#9a9aa1;--line:#2c2c30;--card:#1f1f23;--ok:#3ddc84;--bad:#ff6b5e;--warn:#ffb454;--acc:#6aa8ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 -apple-system,system-ui,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
h1{font-size:16px;margin:0 12px 0 0}nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;color:var(--mut);padding:6px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--card);color:var(--fg);font-weight:600}
main{padding:16px 20px;max-width:980px;margin:auto}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:500;font-size:12px}td.t{white-space:nowrap;color:var(--mut)}td.d{color:var(--mut);font-size:12px;word-break:break-word}
.pill{padding:1px 8px;border-radius:99px;font-size:12px;background:var(--card)}.ok{color:var(--ok)}.error,.bad{color:var(--bad)}.warn{color:var(--warn)}
button.act{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:4px 10px;border-radius:8px;cursor:pointer}
button.act:hover{border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--card);border-radius:12px;padding:14px}.card h3{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--bad)}.dot.on{background:var(--ok)}
.err{color:var(--bad);font-size:12px;margin-top:6px;word-break:break-word}.meta{color:var(--mut);font-size:12px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:10px;display:none}
.empty{color:var(--mut);padding:24px;text-align:center}
.chatfeed{display:flex;flex-direction:column;gap:10px;padding:4px 0 24px}.bub{max-width:78%;padding:8px 12px;border-radius:14px;background:var(--card);white-space:pre-wrap;word-break:break-word}
.bub.me{align-self:flex-end;background:var(--acc);color:#fff}.bub.me .meta{color:rgba(255,255,255,.75)}.bub.bad{border:1px solid var(--bad)}.bub .meta{margin-bottom:2px}
@media(max-width:600px){td.d{display:none}}
</style></head><body>
<header><h1>Vibi Ctrl</h1><nav id="nav"></nav><label class="meta" style="margin-left:auto" title="No mic, no spoken replies: only the animation and typed commands. Message Vibi from the Chat tab."><input type="checkbox" id="stealth" onchange="setStealth(this.checked)"> Stealth</label><label class="meta" style="margin-left:12px">Voice style <select id="style" onchange="setStyle(this.value)"></select></label></header>
<main id="main"></main><div id="toast"></div>
<script>
const T="__TOKEN__",TABS=[["actions","Actions"],["commands","Commands"],["notes","Notes"],["chat","Chat"],["board","Message board"],["components","Components"]];
let tab=(TABS.find(x=>x[0]==location.hash.slice(1))||[])[0]||localStorage.getItem("vctrlTab")||"actions",timer;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(p,body){const r=await fetch(p+(p.includes("?")?"&":"?")+"t="+T,body?{method:"POST",body:JSON.stringify(body)}:{});return r.json()}
function toast(m){const e=$("#toast");e.textContent=m;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",4500)}
function nav(){$("#nav").innerHTML=TABS.map(([k,n])=>`<button class="${k==tab?"on":""}" onclick="go('${k}')">${n}</button>`).join("")}
function go(k){tab=k;try{localStorage.setItem("vctrlTab",k)}catch(e){}nav();load()}
function chatShell(){if(!$("#chatFeed"))$("#main").innerHTML=`<form id="chat" onsubmit="sendChat(event)" style="display:flex;gap:8px;margin-bottom:12px"><select id="chatTo" class="act" style="font:inherit"><option value="vibi">Vibi (typed command)</option><option value="claude">Claude</option><option value="grok">Grok Bot</option><option value="gemini">Gemini</option><option value="computer">Computer use</option></select><input id="chatText" autocomplete="off" placeholder="Message…" style="flex:1;font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)"><label class="act" style="cursor:pointer;white-space:nowrap" title="Attach a file (5 MB max; not for Computer use)">📎 File<input id="chatFile" type="file" style="display:none" onchange="fileChosen()"></label><span id="chatFileName" class="meta"></span><button class="act">Send</button></form><div id="chatFeed" class="chatfeed"></div>`;return $("#chatFeed")}
function boardShell(){if(!$("#feed"))$("#main").innerHTML='<div id="feed"></div>';return $("#feed")}
function fileChosen(){const f=$("#chatFile").files[0];$("#chatFileName").textContent=f?f.name:""}
function readFile(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]||"");r.onerror=()=>no(r.error);r.readAsDataURL(f)})}
async function sendChat(e){e.preventDefault();const t=$("#chatText"),text=t.value.trim();if(!text)return;const to=$("#chatTo").value,f=$("#chatFile").files[0],body={to,text};
  if(f){if(to=="computer"){toast("Files can't be sent to Computer use");return}if(f.size>5*1024*1024){toast("File too large (5 MB max)");return}body.file={name:f.name,data:await readFile(f)}}
  const r=await api("/api/chat",body);if(r.error){toast(r.error);return}t.value="";$("#chatFile").value="";fileChosen();toast(r.to=="computer"?"Computer use started. "+r.note:r.to=="vibi"?"Sent to Vibi; the reply will appear on the Message board":r.to=="gemini"?"Asked Gemini; the answer will appear here":"Sent to "+(r.to=="grok"?"Grok Bot":"Claude"));load()}
function chatBubbles(m){const names={"Claude":"Claude","Grok Bot":"Grok","Gemini":"Gemini"},out=[];
  for(const r of m.filter(r=>names[r.source]).slice().reverse()){const who=names[r.source],t=esc(r.time),body=r.body||r.summary||"";
    if(r.source=="Gemini"){const q=body.match(/^Q: ([\s\S]*?)\n\n(?:A: )?([\s\S]*)$/);
      if(q){out.push(`<div class="bub me"><div class="meta">You → Gemini · ${t}</div>${esc(q[1])}</div>`,`<div class="bub ${r.status=="failed"?"bad":""}"><div class="meta">Gemini · ${t}</div>${esc(q[2])}</div>`);continue}}
    if(r.direction=="from")out.push(`<div class="bub me"><div class="meta">You → ${who} · ${t} · ${esc(r.status)}</div>${esc(body)}</div>`);
    else out.push(`<div class="bub ${r.status=="failed"?"bad":""}"><div class="meta">${who} · ${t}</div>${esc(body)}</div>`)}
  return out.join("")||'<div class="empty">No conversation yet. Pick Claude, Grok or Gemini above and send a message.</div>'}
async function load(){
  if(tab=="chat"){const feed=chatShell(),m=await api("/api/messages?hours=72"),atEnd=feed.scrollHeight<=0||window.innerHeight+window.scrollY>=document.body.scrollHeight-80,first=!feed.dataset.n;feed.innerHTML=chatBubbles(m);feed.dataset.n=1;if(first||atEnd)window.scrollTo(0,document.body.scrollHeight);return}
  if(tab=="components"){const c=await api("/api/components");$("#main").innerHTML='<div class="grid">'+c.map(x=>`<div class="card"><h3><span><span class="dot ${x.running?"on":""}"></span>${esc(x.name)}</span><span class="meta">${x.running?"running":"stopped"}${x.pid?" · pid "+x.pid:""}</span></h3>
  <div class="meta">${esc(x.detail)}</div>${x.error?`<div class="err">last error: ${esc(x.error)}</div>`:""}${x.key=="board"?`<p><button class="act" onclick="mute(${!x.muted})">${x.muted?"Unmute":"Mute"} board &amp; Mac</button></p>`:""}${x.restart?`<p><button class="act" onclick="restart('${esc(x.restart)}','${esc(x.name)}')">Restart</button></p>`:""}</div>`).join("")+"</div>";return}
  if(tab=="board"){const all=window.boardAll||false,m=await api("/api/messages?hours="+(all?0:48)),bar=`<p class="meta">${all?"All messages":"Last 48 hours"} · <a href="#" onclick="boardAll=!boardAll;load();return false">${all?"Show last 48 hours":"Show all"}</a></p>`;
    boardShell().innerHTML=bar+(m.length?'<table><tr><th>Time</th><th>Category</th><th></th><th>Message</th><th>Status</th></tr>'+m.map((r,i)=>`<tr><td class="t">${esc(r.time)}</td><td><span class="pill">${esc(r.category)}</span></td><td class="meta">${r.direction=="to"?"→ Vibi":"Vibi →"}</td>
    <td>${esc(r.summary)}${r.body&&r.body!==r.summary?` <button class="act" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">Expand</button><div class="d" hidden style="white-space:pre-wrap;margin-top:6px">${esc(r.body)}</div>`:""}</td>
    <td><span class="pill ${r.status=="failed"?"error":r.status=="done"||r.status=="answered"||r.status=="delivered"||r.status=="sent"?"ok":""}">${esc(r.status)}</span></td></tr>`).join("")+"</table>":'<div class="empty">No messages in this time range. Grok Bot, Claude, phone apps, WhatsApp and job-hunt results show up here.</div>');return}
  const rows=await api("/api/history?kind="+tab);
  $("#main").innerHTML=rows.length?`<table><tr><th>Time</th><th>${tab=="actions"?"Action":"Entry"}</th><th>Status</th><th>Result</th><th></th></tr>`+rows.map(r=>`<tr><td class="t">${esc(r.time)}</td>
  <td>${esc(r.title)}${r.risky?' <span class="pill warn">asks first</span>':""}${r.source?`<div class="meta">${esc(r.source)}</div>`:""}</td><td><span class="pill ${r.status=="error"?"error":r.status=="ok"||r.status=="done"?"ok":""}">${esc(r.status)}</span></td>
  <td class="d">${esc(r.detail)}</td><td>${r.rerun?`<button class="act" onclick="rerun('${esc(r.id)}',${r.risky})">Rerun</button>`:""}</td></tr>`).join("")+"</table>":'<div class="empty">Nothing yet. New voice requests show up here.</div>'}
async function rerun(id,risky){if(risky&&!confirm("This is a risky kind of action. Vibi will speak the details and wait for your spoken yes before doing anything. Continue?"))return;const r=await api("/api/rerun",{kind:tab,id});toast(r.note||r.error)}
async function mute(on){await api("/api/mute",{on});toast(on?"Muted: board and Mac are off":"Unmuted");load()}
async function restart(k,n){if(!confirm("Restart "+n+"?"))return;const r=await api("/api/restart",{key:k});toast(r.ok?(r.note||n+" restarting"):"Failed: "+r.error);setTimeout(load,3000)}
async function loadStealth(){const r=await api("/api/stealth");$("#stealth").checked=!!r.on}
async function setStealth(on){const r=await api("/api/stealth",{on});toast(on?"Stealth on: no mic, no voice. Type commands in the Chat tab.":"Stealth off");$("#stealth").checked=!!r.on}
async function loadStyle(){const s=await api("/api/style");$("#style").innerHTML=s.styles.map(x=>`<option ${x==s.style?"selected":""}>${x}</option>`).join("")}
async function setStyle(v){const r=await api("/api/style",{style:v});toast("Voice style: "+r.style+(r.error?" ("+r.error+")":""))}
nav();loadStyle();loadStealth();load();timer=setInterval(()=>{if(!document.hidden)load()},5000);
</script></body></html>
