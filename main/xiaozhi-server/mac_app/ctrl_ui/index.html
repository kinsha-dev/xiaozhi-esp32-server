<header><h1>Vibi Ctrl</h1><nav id="nav"></nav><label class="meta" style="margin-left:auto" title="No mic, no spoken replies: only the animation and typed commands. Message Vibi from the Chat tab."><input type="checkbox" id="stealth" onchange="setStealth(this.checked)"> Stealth</label><label class="meta" style="margin-left:12px">Voice style <select id="style" onchange="setStyle(this.value)"></select></label></header>
<main id="main"></main><div id="toast"></div>
<script>
const T="__TOKEN__",TABS=[["chat","Chat"]];
const OLD_TABS={board:"chat",actions:"chat",commands:"chat",notes:"chat",todo:"chat",components:"chat"},tabKey=k=>(TABS.find(x=>x[0]==(OLD_TABS[k]||k))||[])[0];  // old #board, #actions, #commands links open Chat
let linkFilter={"#commands":{type:["commands"],action:["all"],hours:["0"]},"#notes":{type:["note"],hours:["0"]},"#todo":{type:["todo"],hours:["0"]}}[location.hash]||null;  // the old Commands, Notes and Todo lists
let tab=tabKey(location.hash.slice(1))||tabKey(localStorage.getItem("vctrlTab"))||"chat",timer;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(p,body){const r=await fetch(p+(p.includes("?")?"&":"?")+"t="+T,body?{method:"POST",body:JSON.stringify(body)}:{}),j=await r.json();
  // a risky message (to Siri) is only sent after a yes; asked here so every way of sending goes through it
  if(p=="/api/chat"&&j.confirm&&!body.confirmed)return confirm(j.note)?api(p,{...body,confirmed:true}):{error:"Not sent"};return j}
function toast(m){const e=$("#toast");e.textContent=m;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",4500)}
function nav(){$("#nav").innerHTML=(TABS.length<2?[]:TABS).map(([k,n])=>`<button class="${k==tab?"on":""}" onclick="go('${k}')">${n}</button>`).join("")}
function go(k){window.speechSynthesis?.cancel();tab=k;try{localStorage.setItem("vctrlTab",k)}catch(e){}nav();load()}

/* ---- Chat tab: an A2UI v1.0 surface (https://a2ui.org). The "agent" side below emits createSurface / updateDataModel messages
   (flat component list, @path bindings, event actions, list template); A2ui renders them with this page's own components.
   Catalog: the basic catalog (Column, Row, List, Text, TextField, ChoicePicker, Button) plus one custom component, ChatBubble. ---- */
const CHAT_SURFACE={version:"1.0",createSurface:{surfaceId:"chat",catalogId:"vibi:ctrl-chat",components:[
 {id:"root",component:"Column",children:["filters","feed","form"]},
 {id:"filters",component:"Row",align:"center",children:["fType","fAct","fInput","fDir","fRange"]},
 {id:"fType",component:"ChoicePicker",variant:"mutuallyExclusive",label:"Message type",value:{"@path":"/filter/type"},action:{event:{name:"filter"}},options:[{label:"All types",value:"all"},{label:"Conversations",value:"conversation"},{label:"Commands",value:"commands"},{label:"Actions",value:"actions"},{label:"Claude",value:"claude"},{label:"Grok Bot",value:"grok"},{label:"Gemini",value:"gemini"},{label:"Siri",value:"siri"},{label:"Computer use",value:"computer"},{label:"Vibi",value:"vibi"},{label:"Todo list",value:"todo"},{label:"Notes",value:"note"},{label:"Job hunt",value:"jobs"},{label:"Notifications",value:"notifications"},{label:"WhatsApp",value:"whatsapp"},{label:"Mail digest",value:"mail"},{label:"Other",value:"other"}]},
 {id:"fAct",component:"ChoicePicker",variant:"mutuallyExclusive",label:"Action",value:{"@path":"/filter/action"},action:{event:{name:"filter"}},options:[{label:"Action: recognized",value:"recognized"},{label:"Action: unrecognized",value:"unrecognized"},{label:"Action: all",value:"all"}]},
 {id:"fInput",component:"ChoicePicker",variant:"mutuallyExclusive",label:"Voice or typed",value:{"@path":"/filter/input"},action:{event:{name:"filter"}},options:[{label:"Voice and typed",value:"all"},{label:"Voice",value:"voice"},{label:"Typed",value:"typed"}]},
 {id:"fDir",component:"ChoicePicker",variant:"mutuallyExclusive",label:"Direction",value:{"@path":"/filter/direction"},action:{event:{name:"filter"}},options:[{label:"Both directions",value:"all"},{label:"To Vibi (received)",value:"to"},{label:"From Vibi (sent)",value:"from"}]},
 {id:"fRange",component:"ChoicePicker",variant:"mutuallyExclusive",label:"Time range",value:{"@path":"/filter/hours"},action:{event:{name:"filter"}},options:[{label:"Last 72 hours",value:"72"},{label:"All time",value:"0"}]},
 {id:"form",component:"Row",align:"end",children:["to","text","micBtn","pasteBtn","fileBtn","fileName","fileClear","siriBtn","send"]},
 {id:"to",component:"ChoicePicker",variant:"mutuallyExclusive",label:"To",value:{"@path":"/chat/to"},options:[{label:"Vibi (typed command)",value:"vibi"},{label:"Claude",value:"claude"},{label:"Grok Bot",value:"grok"},{label:"Gemini",value:"gemini"},{label:"Siri",value:"siri"},{label:"Computer use",value:"computer"},{label:"Todo list",value:"todo"},{label:"Note (save)",value:"note"}]},
 {id:"text",component:"TextField",label:"Message",placeholder:"Message…",variant:"longText",value:{"@path":"/chat/text"},weight:1},
 {id:"micBtn",component:"Button",child:"micLbl",action:{event:{name:"mic"}}},
 {id:"micLbl",component:"Text",text:"🎤 Mic"},
 {id:"pasteBtn",component:"Button",child:"pasteLbl",action:{event:{name:"paste"}}},
 {id:"pasteLbl",component:"Text",text:"📋 Paste"},
 {id:"fileClear",component:"Button",child:"clearLbl",visible:{"@path":"/chat/fileName"},action:{event:{name:"clear_file"}}},
 {id:"clearLbl",component:"Text",text:"✕ Remove"},
 {id:"fileBtn",component:"Button",child:"fileLbl",action:{event:{name:"pick_file"}}},
 {id:"fileLbl",component:"Text",text:"📎 File"},
 {id:"fileName",component:"Text",variant:"caption",text:{"@path":"/chat/fileName"}},
 {id:"siriBtn",component:"Button",child:"siriLbl",action:{event:{name:"send_siri",context:{text:{"@path":"/chat/text"}}}}},
 {id:"siriLbl",component:"Text",text:"Send to Siri"},
 {id:"send",component:"Button",variant:"primary",child:"sendLbl",action:{event:{name:"send_chat",context:{to:{"@path":"/chat/to"},text:{"@path":"/chat/text"}}}}},
 {id:"sendLbl",component:"Text",text:"Send"},
 {id:"feed",component:"List",children:{path:"/messages",componentId:"bubble"}},
 {id:"bubble",component:"ChatBubble",reply:{"@path":"reply"},meta:{"@path":"meta"},text:{"@path":"text"},variant:{"@path":"variant"},rich:{"@path":"rich"},images:{"@path":"images"},links:{"@path":"links"},to:{"@path":"to"},clamp:{"@path":"clamp"},actions:{"@path":"actions"},command:{"@path":"command"},nest:{"@path":"nest"},item:{"@path":"item"},wa:{"@path":"wa"}}],
 dataModel:{chat:{to:["claude"],text:"",fileName:""},filter:{type:["all"],action:["recognized"],input:["all"],direction:["all"],hours:["72"]},messages:[]}}};
const CHAT_NAMES={"Claude":"Claude","Grok Bot":"Grok","Gemini":"Gemini","Siri":"Siri","Todo":"Todo","Vibi":"Vibi"},CHAT_TO={"Claude":"claude","Grok Bot":"grok","Gemini":"gemini","Siri":"siri"};
const CLAMPED=["jobs","notifications","whatsapp","mail","other"];  // long feed items start collapsed; conversations never do
function chatMessagesUpdate(m,direction="all"){const out=[];  // board rows (newest first) -> bubbles, as an updateDataModel message
  for(const r of m.slice().reverse()){const first=out.length;add(r);
    if(r.nest)out.slice(first).forEach(b=>b.nest=true);else if(r.thread&&out[first])out[first].meta="Original conversation · "+out[first].meta}
  function add(r){const who=r.type=="computer"?"Computer use":CHAT_NAMES[r.source]||r.category,body=(r.nest&&r.said)||r.body||r.summary||"",bad=r.status=="failed"?"error":CHAT_NAMES[r.source]?"reply":"other";
    const how=r.input&&r.input!=r.channel?r.input:"",line=(...p)=>[r.match,...p,r.log].filter(Boolean).join(" · "),acts=r.actions?.length?r.actions:null,missed=r.recognized===false?"unrecognized":"";
    if(r.channel=="note"||r.channel=="reminder"||r.item){out.push({meta:line(r.category,r.time,r.status),text:body,variant:"other",clamp:String(r.id),...(r.item?{item:r.item}:{})});return}
    if(r.channel=="whatsapp"){const sent=r.direction=="from",name=sent?(body.match(/^To ([^:\n]*):/)||[])[1]:r.contact;
      out.push({meta:line(r.category,r.time,r.status),text:body,variant:sent?"me":"other",clamp:String(r.id),wa:{contact:name||""}});return}
    if(r.channel=="action"){out.push({variant:"actions",actions:acts});return}
    const command=r.command?{command:{...r.command,id:String(r.id),time:r.time,status:r.channel=="inbox"?{new:"waiting for Claude",read:"read by Claude"}[r.status]||r.status:missed||(r.input=="typed"?"typed":"recognized")}}:{};
    if(r.source=="Gemini"||r.source=="Todo"||r.source=="Siri"||r.channel=="typed"){const q=body.match(/^(?:Q|You): ([\s\S]*?)\n\n(?:(?:A|Vibi): )?([\s\S]*)$/);
      if(q){if(direction!="to"){out.push({meta:line(`You → ${who}`,r.time,r.input),text:q[1],variant:"me",...command});if(acts)out.push({variant:"thread",actions:acts})}if(direction!="from")out.push({meta:line(who,r.time,r.input),text:q[2],variant:bad,reply:replyTarget({...r,direction:"to"},q[2])});return}}
    const extra={...(CLAMPED.includes(r.type)?{clamp:String(r.id)}:{}),...(r.ui?{rich:r.ui}:{}),...(r.images?{images:r.images}:{}),...(r.links?{links:r.links}:{})};
    const status=r.source=="Claude"&&r.channel=="inbox"?{new:"waiting for Claude",read:"read by Claude"}[r.status]||r.status:r.status;
    out.push(r.direction=="from"?{meta:line(`You → ${who}`,r.time,status,r.input,missed),text:body,variant:"me",...command,...extra}:{meta:line(r.category,r.time,r.status,how,missed),text:body,variant:bad,to:CHAT_TO[r.source],reply:replyTarget(r,body),...extra});
    if(acts)out.push({variant:"thread",actions:acts})}
  if(!out.length)out.push({meta:"",text:"No messages match. Change the filters, or pick Claude, Grok or Gemini below and send a message.",variant:"note"});
  return {version:"1.0",updateDataModel:{surfaceId:"chat",path:"/messages",value:out}}}
/* ---- Reply menu: select one response (a Chat bubble) and answer it. The menu is its own A2UI surface;
   the reply goes through /api/chat with the quoted response in front as context. One menu is open at a time, and its element
   is moved back under the selected response after each redraw, so a half-typed reply survives the 5 s refresh. ---- */
const REPLY_FROM={"Claude":"Claude","Grok Bot":"Grok","Gemini":"Gemini","Vibi":"Vibi"},QUOTE_MAX=1000,CHAT_MAX=4000;
const replyTarget=(r,text)=>r.direction=="to"&&r.status!="running"&&REPLY_FROM[r.source]&&text?{key:String(r.id),who:REPLY_FROM[r.source],time:r.time,to:CHAT_TO[r.source]||"claude",quote:String(text)}:null;
const Reply={target:null,el:null,busy:false,
 open(t){if(this.target?.key!=t.key){this.target=t;A2ui.process({version:"1.0",createSurface:{surfaceId:"reply",catalogId:"vibi:ctrl-chat",components:[
    {id:"root",component:"Column",children:["quote","text","bar","hint"]},
    {id:"hint",component:"Text",variant:"caption",text:"Computer use gets only your text and the first link in the quote; Vibi asks out loud before anything risky."},
    {id:"quote",component:"Text",variant:"caption",text:{"@path":"/reply/quote"}},
    {id:"text",component:"TextField",label:"Reply",placeholder:"Reply…",variant:"longText",value:{"@path":"/reply/text"}},
    {id:"bar",component:"Row",align:"center",children:["to","send","cancel"]},
    {id:"to",component:"ChoicePicker",variant:"mutuallyExclusive",label:"Reply to",value:{"@path":"/reply/to"},options:[{label:"Claude",value:"claude"},{label:"Grok Bot",value:"grok"},{label:"Gemini",value:"gemini"},{label:"Computer use",value:"computer"}]},
    {id:"send",component:"Button",variant:"primary",child:"sendLbl",action:{event:{name:"send_reply",context:{to:{"@path":"/reply/to"},text:{"@path":"/reply/text"}}}}},
    {id:"sendLbl",component:"Text",text:"Send reply"},
    {id:"cancel",component:"Button",child:"cancelLbl",action:{event:{name:"cancel_reply"}}},
    {id:"cancelLbl",component:"Text",text:"Cancel"}],
    dataModel:{reply:{quote:`${t.who} · ${t.time}\n${t.quote.slice(0,200)}${t.quote.length>200?"…":""}`,to:[t.to],text:""}}}});
   this.el?.remove();this.el=document.createElement("div");this.el.className="replybox";A2ui.mount("reply",this.el);
   this.el.onkeydown=e=>{if(e.key=="Escape")this.close()}}
  this.place();this.el.querySelector("textarea")?.focus()},
 close(){this.target=null;this.el?.remove();this.el=null;this.mark()},
 mark(){document.querySelectorAll(".canreply").forEach(n=>n.classList.toggle("sel",n.dataset.key==this.target?.key))},
 place(){const host=this.target&&[...document.querySelectorAll(".canreply")].find(n=>n.dataset.key==this.target.key);this.mark();
  if(host&&this.el.parentNode!=host){host.append(this.el);this.el.scrollIntoView({block:"nearest"})}},
 keep(redraw){const f=document.activeElement,had=this.el?.contains(f);redraw();if(this.target){this.place();if(had&&this.el.isConnected)f.focus({preventScroll:true})}},
 attach(n,t){n.classList.add("canreply");n.dataset.key=t.key;n.onclick=e=>{if(e.target.closest("a,button,select,textarea,input,.replybox")||String(getSelection()))return;this.target?.key==t.key?this.close():this.open(t)}},
 button(t){const b=document.createElement("button");b.type="button";b.className="rbtn";b.textContent="↩ Reply";b.setAttribute("aria-label",`Reply to ${t.who}, ${t.time}`);b.onclick=()=>this.open(t);return b},
 compose(t,text){  // no blank lines: the Chat tab splits Gemini's "Q: …\n\nA: …" rows at the first one
  const tidy=s=>s.replace(/\n\s*\n/g,"\n").trim(),head=`Replying to ${t.who} (${t.time}):`,body=tidy(text),q=tidy(t.quote),room=Math.min(QUOTE_MAX,CHAT_MAX-head.length-body.length-20);

  if(on){Reply.close();filterOpen(false);s.querySelector("input").select();s.querySelector("input").focus();return}
  searchSeq++;s.querySelector(".meta").textContent="";if(searching){searching=false;A2ui.stick=true;load()}}
const refresh=()=>searching?runSearch():load();
async function runSearch(){const s=$("#search"),say=t=>s.querySelector(".meta").textContent=t,q=s.querySelector("input").value.trim(),seq=++searchSeq;
  if(!q){say("");if(searching){searching=false;A2ui.stick=true;load()}return}
  say("Searching…");let r;try{r=await api("/api/search?"+new URLSearchParams({q,scope:s.querySelector("select").value}))}catch(e){r={error:"Search failed"}}
  if(seq!=searchSeq)return;if(r.error){say(r.error);return}
  const rows=r.results.filter(h=>h.row).map(h=>({...h.row,body:h.row.said||h.row.body,match:h.label,thread:undefined,nest:undefined}));
  say([rows.length?`${rows.length} result${rows.length>1?"s":""}`:"Nothing found",r.note].filter(Boolean).join(" · "));
  if(!rows.length){if(searching){searching=false;A2ui.stick=true;load()}return}
  searching=true;Reply.close();document.querySelectorAll(".chatfeed .sedit").forEach(e=>e.remove());
  A2ui.process(chatMessagesUpdate(rows.reverse()));const feed=$(".chatfeed");if(feed)feed.scrollTop=0}
/* Reply to a note or todo with its new text, which replaces it. */
function editor(el,h,saved){if(el.querySelector(".sedit"))return;const w=document.createElement("div");w.className="sedit";
  w.innerHTML=`<textarea rows="${h.kind=="note"?6:2}" aria-label="New text"></textarea><button type="button" class="act pri">Save</button> <button type="button" class="act">Cancel</button>`;
  const t=w.querySelector("textarea"),[save,cancel]=w.querySelectorAll("button");t.value=h.text;cancel.onclick=()=>w.remove();w.onkeydown=e=>{if(e.key=="Escape"){e.stopPropagation();w.remove()}};
  save.onclick=async()=>{save.disabled=true;try{const r=await api("/api/edit",{kind:h.kind,id:h.id,text:t.value,old:h.text});if(r.error){toast(r.error);return}
      toast(h.kind=="note"?"Note saved":"Todo saved");w.remove();saved(r.item)}catch(e){toast("Could not save")}finally{save.disabled=false}};
  el.append(w);t.focus()}
function itemBar(it){const bar=document.createElement("div");bar.className="cmdbar";bar.style.flexWrap="wrap";
  const button=(text,run)=>{const b=document.createElement("button");b.type="button";b.className="rbtn";b.textContent=text;b.onclick=run;bar.append(b)};
  const todo=async op=>{const r=await api("/api/todos",{op,id:it.id});if(r.error)toast(r.error);refresh()};
  button("↩ Reply to edit",()=>editor(bar.parentNode,it,()=>refresh()));
  if(it.kind=="todo"){button(it.done?"Reopen":"Mark done",()=>todo(it.done?"reopen":"done"));button("Delete",()=>confirm("Delete this todo?")&&todo("delete"))}
  return bar}
/* Reply on WhatsApp: the user checks the name, types, and confirms who gets it before anything is sent. */
function whatsappBar(wa){const bar=document.createElement("div");bar.className="cmdbar";const b=document.createElement("button");b.type="button";b.className="rbtn";b.textContent="↩ Reply on WhatsApp";bar.append(b);
  b.onclick=()=>{const host=bar.parentNode;if(host.querySelector(".sedit"))return;const w=document.createElement("div");w.className="sedit wabox";
    w.innerHTML='<input aria-label="Contact name or number" placeholder="Contact name or number with country code"><textarea rows="2" maxlength="4000" aria-label="WhatsApp message" placeholder="Message…"></textarea><button type="button" class="act pri">Send</button> <button type="button" class="act">Cancel</button>';
    const[name,text]=w.querySelectorAll("input,textarea"),[send,cancel]=w.querySelectorAll("button");name.value=wa.contact;cancel.onclick=()=>w.remove();w.onkeydown=e=>{if(e.key=="Escape")w.remove()};
    send.onclick=async()=>{const body={contact:name.value,text:text.value.trim()};if(!body.text)return;send.disabled=true;
      try{const who=await api("/api/whatsapp",body);if(who.error){toast(who.error);return}
        if(!confirm(`Send this WhatsApp to ${who.contact} (+${who.phone})?\n\n${body.text}`))return;
        const r=await api("/api/whatsapp",{...body,phone:who.phone,confirmed:true});if(r.error){toast(r.error);return}
        w.remove();toast("Sent to "+r.contact);refresh()}catch(e){toast("Could not send")}finally{send.disabled=false}};
    host.append(w);text.focus()};
  return bar}
async function loadChat(){if(!$("#chatHost")){$("#main").innerHTML='<div id="chatHost"></div>';A2ui.process(CHAT_SURFACE);A2ui.surfaces.chat.data.filter={...savedFilter(),...linkFilter};linkFilter=null;A2ui.mount("chat",$("#chatHost"));searching=false;
    const b=document.createElement("button");b.id="fbtn";b.type="button";b.className="act";b.onclick=()=>filterOpen(!$("#chatHost").classList.contains("fopen"));$("#chatHost").append(b);filterOpen(false);filterButton();
    const find=document.createElement("button");find.id="sbtn";find.type="button";find.className="act";find.textContent="🔍 Search";find.onclick=()=>searchOpen(true);$("#chatHost").append(find,searchShell())}
  if($(".chatfeed .sedit"))return;  // a redraw would drop a half-typed edit
  if(searching)return;  // the chat is showing search results
  const seq=++chatSeq,f=A2ui.surfaces.chat.data.filter,q=new URLSearchParams({type:f.type[0],action:f.action[0],input:f.input[0],direction:f.direction[0],hours:f.hours[0]});
  const rows=await api("/api/messages?"+q);if(seq==chatSeq&&tab=="chat"&&!searching)A2ui.process(chatMessagesUpdate(rows,f.direction[0]))}
async function load(){
  document.body.classList.toggle("chat",tab=="chat");return loadChat()}
async function rerun(id,risky,kind=tab){if(risky&&!confirm("This is a risky kind of action. Vibi will speak the details and wait for your spoken yes before doing anything. Continue?"))return;const r=await api("/api/rerun",{kind,id});toast(r.note||r.error)}
async function mute(on){await api("/api/mute",{on});toast(on?"Muted: board and Mac are off":"Unmuted");load()}
async function loadStealth(){const r=await api("/api/stealth");$("#stealth").checked=!!r.on}
async function setStealth(on){const r=await api("/api/stealth",{on});toast(on?"Stealth on: no mic, no voice. Type commands in the Chat tab.":"Stealth off");$("#stealth").checked=!!r.on}
async function loadStyle(){const s=await api("/api/style");$("#style").innerHTML=s.styles.map(x=>`<option ${x==s.style?"selected":""}>${x}</option>`).join("")}
async function setStyle(v){const r=await api("/api/style",{style:v});toast("Voice style: "+r.style+(r.error?" ("+r.error+")":""))}
nav();loadStyle();loadStealth();load();timer=setInterval(()=>{if(!document.hidden)load()},5000);
</script><script>
/* Plugins (ctrl_ui/plugins/*.js): each gets a header button that opens a floating panel it draws into. */
const VibiPlugins={list:[],open:null,
 add(p){const nav=$("#nav"),b=document.createElement("button");b.type="button";b.id="plug-"+p.id;b.className="act";b.textContent=p.label;b.onclick=()=>this.show(this.open==p?null:p);nav.after(b);
  const box=document.createElement("section");box.className="plugin";box.hidden=true;box.innerHTML=`<header><b>${esc(p.title)}</b><button type="button" class="act" aria-label="Close ${esc(p.title)}">✕</button></header><div></div>`;
  box.querySelector("button").onclick=()=>this.show(null);document.body.append(box);p.box=box;this.list.push(p);
  if(location.hash=="#"+p.id)this.show(p);else p.render(box.lastElementChild).catch(()=>{})},
 show(p){clearInterval(this.timer);for(const q of this.list)q.box.hidden=q!==p;this.open=p;if(!p)return;this.draw();
  if(p.every)this.timer=setInterval(()=>{if(!document.hidden)this.draw()},p.every)},
 draw(){const p=this.open;p&&p.render(p.box.lastElementChild).catch(()=>{p.box.lastElementChild.textContent="Not available right now"})}};
document.addEventListener("keydown",e=>{if(e.key=="Escape"&&VibiPlugins.open)VibiPlugins.show(null)});
</script>
