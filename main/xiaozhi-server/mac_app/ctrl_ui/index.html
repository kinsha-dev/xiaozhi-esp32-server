<style>

</style></head><body>
<header><h1>Vibi Ctrl</h1><nav id="nav"></nav><label class="meta" style="margin-left:auto" title="No mic, no spoken replies: only the animation and typed commands. Message Vibi from the Chat tab."><input type="checkbox" id="stealth" onchange="setStealth(this.checked)"> Stealth</label><label class="meta" style="margin-left:12px">Voice style <select id="style" onchange="setStyle(this.value)"></select></label></header>
<main id="main"></main><div id="toast"></div>
<script>
const T="__TOKEN__",TABS=[["actions","Actions"],["commands","Commands"],["notes","Notes"],["chat","Chat"],["todo","Todo"],["board","Message board"],["components","Components"]];
let tab=(TABS.find(x=>x[0]==location.hash.slice(1))||[])[0]||localStorage.getItem("vctrlTab")||"actions",timer;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(p,body){const r=await fetch(p+(p.includes("?")?"&":"?")+"t="+T,body?{method:"POST",body:JSON.stringify(body)}:{});return r.json()}
function toast(m){const e=$("#toast");e.textContent=m;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",4500)}
function nav(){$("#nav").innerHTML=TABS.map(([k,n])=>`<button class="${k==tab?"on":""}" onclick="go('${k}')">${n}</button>`).join("")}
function go(k){tab=k;try{localStorage.setItem("vctrlTab",k)}catch(e){}nav();load()}
function boardShell(){if(!$("#feed"))$("#main").innerHTML='<div id="feed"></div>';return $("#feed")}
function readFile(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]||"");r.onerror=()=>no(r.error);r.readAsDataURL(f)})}

/* ---- Chat tab: an A2UI v1.0 surface (https://a2ui.org). The "agent" side below emits createSurface / updateDataModel messages

   Catalog: the basic catalog (Column, Row, List, Text, TextField, ChoicePicker, Button) plus one custom component, ChatBubble. ---- */
const CHAT_SURFACE={version:"1.0",createSurface:{surfaceId:"chat",catalogId:"vibi:ctrl-chat",components:[
 {id:"root",component:"Column",children:["feed","form"]},
 {id:"form",component:"Row",align:"end",children:["to","text","fileBtn","fileName","send"]},
 {id:"to",component:"ChoicePicker",variant:"mutuallyExclusive",label:"To",value:{"@path":"/chat/to"},options:[{label:"Vibi (typed command)",value:"vibi"},{label:"Claude",value:"claude"},{label:"Grok Bot",value:"grok"},{label:"Gemini",value:"gemini"},{label:"Computer use",value:"computer"},{label:"Todo list",value:"todo"}]},
 {id:"text",component:"TextField",label:"Message",placeholder:"Message…",variant:"longText",value:{"@path":"/chat/text"},weight:1},
 {id:"fileBtn",component:"Button",child:"fileLbl",action:{event:{name:"pick_file"}}},
 {id:"fileLbl",component:"Text",text:"📎 File"},
 {id:"fileName",component:"Text",variant:"caption",text:{"@path":"/chat/fileName"}},
 {id:"send",component:"Button",variant:"primary",child:"sendLbl",action:{event:{name:"send_chat",context:{to:{"@path":"/chat/to"},text:{"@path":"/chat/text"}}}}},
 {id:"sendLbl",component:"Text",text:"Send"},
 {id:"feed",component:"List",children:{path:"/messages",componentId:"bubble"}},
 {id:"bubble",component:"ChatBubble",reply:{"@path":"reply"},meta:{"@path":"meta"},text:{"@path":"text"},variant:{"@path":"variant"},rich:{"@path":"rich"},images:{"@path":"images"},links:{"@path":"links"},to:{"@path":"to"}}],
 dataModel:{chat:{to:["claude"],text:"",fileName:""},messages:[]}}};
const CHAT_NAMES={"Claude":"Claude","Grok Bot":"Grok","Gemini":"Gemini","Todo":"Todo"},CHAT_TO={"Claude":"claude","Grok Bot":"grok","Gemini":"gemini"};
function chatMessagesUpdate(m){const out=[];  // board rows (newest first) -> bubbles, as an updateDataModel message
  for(const r of m.filter(r=>CHAT_NAMES[r.source]).slice().reverse()){const who=CHAT_NAMES[r.source],body=r.body||r.summary||"",bad=r.status=="failed"?"error":"reply";
    if(r.source=="Gemini"||r.source=="Todo"){const q=body.match(/^Q: ([\s\S]*?)\n\n(?:A: )?([\s\S]*)$/);
      if(q){out.push({meta:`You → ${who} · ${r.time}`,text:q[1],variant:"me"},{meta:`${who} · ${r.time}`,text:q[2],variant:bad,reply:replyTarget(r,q[2])});continue}}
    out.push(r.direction=="from"?{meta:`You → ${who} · ${r.time} · ${r.source=="Claude"?{new:"waiting for Claude",read:"read by Claude"}[r.status]||r.status:r.status}`,text:body,variant:"me"}:{meta:`${who} · ${r.time}`,text:body,variant:bad,to:CHAT_TO[r.source],reply:replyTarget(r,body),...(r.ui?{rich:r.ui}:{}),...(r.images?{images:r.images}:{}),...(r.links?{links:r.links}:{})})}
  if(!out.length)out.push({meta:"",text:"No conversation yet. Pick Claude, Grok or Gemini above and send a message.",variant:"note"});
  return {version:"1.0",updateDataModel:{surfaceId:"chat",path:"/messages",value:out}}}
/* ---- Reply menu: select one response (Chat bubble or Message board row) and answer it. The menu is its own A2UI surface;
   the reply goes through /api/chat with the quoted response in front as context. One menu is open at a time, and its element
   is moved back under the selected response after each redraw, so a half-typed reply survives the 5 s refresh. ---- */
const REPLY_FROM={"Claude":"Claude","Grok Bot":"Grok","Gemini":"Gemini","Vibi":"Vibi"},QUOTE_MAX=1000,CHAT_MAX=4000;
const replyTarget=(r,text)=>r.direction=="to"&&REPLY_FROM[r.source]&&text?{key:String(r.id),who:REPLY_FROM[r.source],time:r.time,to:CHAT_TO[r.source]||"claude",quote:String(text)}:null;
const Reply={target:null,el:null,busy:false,
 open(t){if(this.target?.key!=t.key){this.target=t;A2ui.process({version:"1.0",createSurface:{surfaceId:"reply",catalogId:"vibi:ctrl-chat",components:[
    {id:"root",component:"Column",children:["quote","text","bar","hint"]},
    {id:"hint",component:"Text",variant:"caption",text:"Computer use gets only your text and the first link in the quote; Vibi asks out loud before anything risky."},
    {id:"quote",component:"Text",variant:"caption",text:{"@path":"/reply/quote"}},
    {id:"text",component:"TextField",label:"Reply",placeholder:"Reply…",variant:"longText",value:{"@path":"/reply/text"}},
    {id:"bar",component:"Row",align:"center",children:["to","send","cancel"]},
    {id:"to",component:"ChoicePicker",variant:"mutuallyExclusive",label:"Reply to",value:{"@path":"/reply/to"},options:[{label:"Claude",value:"claude"},{label:"Grok Bot",value:"grok"},{label:"Gemini",value:"gemini"},{label:"Computer use",value:"computer"}]},
    {id:"send",component:"Button",variant:"primary",child:"sendLbl",action:{event:{name:"send_reply",context:{to:{"@path":"/reply/to"},text:{"@path":"/reply/text"}}}}},
    {id:"sendLbl",component:"Text",text:"Send reply"},
    {id:"cancel",component:"Button",child:"cancelLbl",action:{event:{name:"cancel_reply"}}},
    {id:"cancelLbl",component:"Text",text:"Cancel"}],
    dataModel:{reply:{quote:`${t.who} · ${t.time}\n${t.quote.slice(0,200)}${t.quote.length>200?"…":""}`,to:[t.to],text:""}}}});
   this.el?.remove();this.el=document.createElement("div");this.el.className="replybox";A2ui.mount("reply",this.el);
   this.el.onkeydown=e=>{if(e.key=="Escape")this.close()}}
  this.place();this.el.querySelector("textarea")?.focus()},
 close(){this.target=null;this.el?.closest("tr.replyrow")?.remove();this.el?.remove();this.el=null;this.mark()},
 mark(){document.querySelectorAll(".canreply").forEach(n=>n.classList.toggle("sel",n.dataset.key==this.target?.key))},
 place(){const host=this.target&&[...document.querySelectorAll(".canreply")].find(n=>n.dataset.key==this.target.key);this.mark();if(!host)return;
  if(host.tagName=="TR"){if(host.nextElementSibling?.contains(this.el))return;this.el.closest("tr.replyrow")?.remove();const tr=document.createElement("tr"),td=document.createElement("td");tr.className="replyrow";td.colSpan=host.children.length;td.append(this.el);tr.append(td);host.after(tr)}
  else if(this.el.parentNode!=host){host.append(this.el);this.el.scrollIntoView({block:"nearest"})}},
 keep(redraw){const f=document.activeElement,had=this.el?.contains(f);redraw();if(this.target){this.place();if(had&&this.el.isConnected)f.focus({preventScroll:true})}},
 attach(n,t){n.classList.add("canreply");n.dataset.key=t.key;n.onclick=e=>{if(e.target.closest("a,button,select,textarea,input,.replybox")||String(getSelection()))return;this.target?.key==t.key?this.close():this.open(t)}},
 button(t){const b=document.createElement("button");b.type="button";b.className="rbtn";b.textContent="↩ Reply";b.setAttribute("aria-label",`Reply to ${t.who}, ${t.time}`);b.onclick=()=>this.open(t);return b},
 compose(t,text){  // no blank lines: the Chat tab splits Gemini's "Q: …\n\nA: …" rows at the first one
  const tidy=s=>s.replace(/\n\s*\n/g,"\n").trim(),head=`Replying to ${t.who} (${t.time}):`,body=tidy(text),q=tidy(t.quote),room=Math.min(QUOTE_MAX,CHAT_MAX-head.length-body.length-20);
  if(room<1)return null;return`${head}\n> ${(q.length>room?q.slice(0,room)+"…":q).replace(/\n/g,"\n> ")}\n${body}`},
 task(t,text){  // computer use takes one short task (300 chars) and drives the Mac: pass the user's words plus a link, not the bot's text
  const link=(t.quote.match(/https?:\/\/[^\s<>"'()\[\]]+/)||[""])[0].replace(/[.,;:!?]+$/,""),task=text.replace(/\s+/g," ")+(link?` (link: ${link})`:"");return task.length<=280?task:null},
 async send(ctx){const text=String(ctx.text||"").trim(),to=(ctx.to||[])[0],t=this.target;if(!text||!t||this.busy)return;
  const cu=to=="computer",full=cu?this.task(t,text):this.compose(t,text);if(!full||full.length>CHAT_MAX){toast(cu?"Keep a computer task short (280 characters, link included)":"Reply too long");return}
  this.busy=true;try{const r=await api("/api/chat",{to,text:full});if(r.error){toast(r.error);return}
   if(this.target===t)this.close();A2ui.stick=true;toast(to=="computer"?"Sent to computer use. "+r.note:r.note||(to=="gemini"?"Asked Gemini; the answer will appear in Chat":"Reply sent to "+(to=="grok"?"Grok Bot":"Claude")));load()}
  catch(e){toast("Could not send the reply")}finally{this.busy=false}}};
/* Rich answers: an optional A2UI surface (`ui`) from the bot is untrusted. It is cut down again here (whitelisted components,
   http(s) URLs only, Button events limited to reply / open_url) and drawn with the same renderer; unknown components become Text. */
const RICH_OK=new Set(["Column","Row","List","Card","Tabs","Divider","Text","Image","Icon","Button","Badge"]),httpUrl=u=>typeof u=="string"&&/^https?:\/\/\S+$/i.test(u)&&u.length<2048?u:"";
function cleanRich(r,to){if(!r||typeof r!="object"||!Array.isArray(r.components))return null;const comps={};
  for(const x of r.components.slice(0,200)){if(!x||typeof x!="object"||typeof x.id!="string")continue;let c={...x};
    if(!RICH_OK.has(c.component))c={id:c.id,component:"Text",text:[c.text,c.label,c.title,c.description].find(t=>typeof t=="string")||""};
    if(c.component=="Image"&&typeof c.url=="string")c.url=httpUrl(c.url);
    if(c.component=="Button"){const e=c.action&&c.action.event,ok=e&&((e.name=="reply"&&typeof e.context?.text=="string"&&e.context.text.trim())||(e.name=="open_url"&&httpUrl(e.context?.url)));if(!ok)c={id:c.id,component:"Card",child:c.child}}
    comps[c.id]=c}
  if(!comps.root)return null;let data={};try{data=JSON.parse(JSON.stringify(r.dataModel&&typeof r.dataModel=="object"?r.dataModel:{}))}catch(e){}
  return{comps,data,watch:[],to:["claude","grok","gemini"].includes(to)?to:"grok"}}
const A2ui={surfaces:{},onEvent:null,
 process(msg){const c=msg.createSurface;if(c){this.surfaces[c.surfaceId]={comps:Object.fromEntries(c.components.map(x=>[x.id,x])),data:c.dataModel||{},watch:[]};return}
  const u=msg.updateDataModel;if(u){const sf=this.surfaces[u.surfaceId];this.set(sf,u.path,u.value);this.refresh(sf)}},
 refresh(sf){Reply.keep(()=>sf.watch.forEach(f=>f()))},  // a redraw rebuilds bubbles; keep() puts the open reply menu back
 get(sf,path,scope){const parts=((path[0]=="/"?"":(scope||"")+"/")+path).split("/").filter(Boolean);let v=sf.data;for(const k of parts){if(v==null)return;v=v[k]}return v},
 set(sf,path,val){const parts=path.split("/").filter(Boolean);let o=sf.data;for(const k of parts.slice(0,-1))o=o[k]??={};parts.length?o[parts.at(-1)]=val:sf.data=val},
 val(sf,x,scope){return x&&typeof x=="object"&&!Array.isArray(x)&&"@path" in x?this.get(sf,x["@path"],scope):x},
 mount(id,host){const sf=this.surfaces[id];host.replaceChildren(this.node(sf,"root",""));return sf},
 node(sf,cid,scope){if((sf.depth=(sf.depth||0)+1)>12||!sf.comps[cid]){sf.depth--;return document.createElement("span")}try{return this.node0(sf,cid,scope)}finally{sf.depth--}},
 node0(sf,cid,scope){const c=sf.comps[cid],me=this,v=x=>me.val(sf,x,scope),el=document.createElement("div");
  const bind=f=>{f();sf.watch.push(f)},kids=()=>(Array.isArray(c.children)?c.children:[]).filter(k=>typeof k=="string").map(k=>me.node(sf,k,scope));
  if(c.weight)el.style.flex=c.weight;
  switch(c.component){
   case"Column":case"Row":el.style.cssText+=`display:flex;gap:8px;flex-direction:${c.component=="Row"?"row":"column"}${c.align=="center"?";align-items:center":c.align=="end"?";align-items:flex-end;flex-wrap:wrap":""}`;el.append(...kids());break;
   case"List":{const isFeed=sf===me.surfaces.chat&&cid=="feed";el.className=isFeed?"chatfeed":"rlist";let last,own=[];const t=c.children,draw=()=>{const items=me.get(sf,t.path)||[],j=JSON.stringify(items);if(j==last)return;last=j;
      const atEnd=isFeed&&el.scrollHeight-el.scrollTop-el.clientHeight<80,first=!el.dataset.n;el.dataset.n=1;
      sf.watch=sf.watch.filter(f=>!own.includes(f));const n=sf.watch.length,fill=()=>el.replaceChildren(...items.map((_,i)=>me.node(sf,t.componentId,t.path+"/"+i)));fill();own=sf.watch.slice(n);if(isFeed&&(first||atEnd||me.stick)){el.scrollTop=el.scrollHeight;me.stick=false}};bind(draw);break}
   case"Text":bind(()=>{el.textContent=v(c.text)??"";el.className=c.variant=="caption"?"meta":""});break;
   case"ChatBubble":bind(()=>{const k=v(c.variant);el.className="bub "+(k=="me"?"me":k=="error"?"bad":k=="note"?"note":"");
      el.innerHTML=(v(c.meta)?`<div class="meta">${esc(v(c.meta))}</div>`:"")+esc(v(c.text));
      const rich=cleanRich(v(c.rich),v(c.to));if(rich){const h=document.createElement("div");h.className="rich";h.append(me.node(rich,"root",""));el.append(h)}
      const ims=(Array.isArray(v(c.images))?v(c.images):[]).map(httpUrl).filter(Boolean).slice(0,8),lks=(Array.isArray(v(c.links))?v(c.links):[]).filter(l=>l&&httpUrl(l.url)).slice(0,8);
      if(ims.length){const h=document.createElement("div");h.className="rich rimgs";for(const u of ims){const im=document.createElement("img");im.src=u;im.alt="";im.referrerPolicy="no-referrer";im.loading="lazy";h.append(im)}el.append(h)}
      if(lks.length){const h=document.createElement("div");h.className="rich";for(const l of lks){const a=document.createElement("a");a.href=l.url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=String(l.title||l.url);a.style.cssText="display:block;color:var(--acc)";h.append(a)}el.append(h)}
      const rt=v(c.reply);if(rt){Reply.attach(el,rt);el.append(Reply.button(rt))}});break;
   case"Card":el.className="rcard";if(c.child)el.append(me.node(sf,c.child,scope));break;
   case"Divider":el.className="rdiv";break;
   case"Badge":el.className="pill rbadge";bind(()=>{el.textContent=v(c.text)??"";el.style.display=el.textContent?"":"none"});break;
   case"Icon":bind(()=>{el.textContent=v(c.name)??""});break;
   case"Image":{const im=document.createElement("img");im.className="rimg";im.alt=v(c.description)||"";im.referrerPolicy="no-referrer";im.loading="lazy";bind(()=>{const u=httpUrl(v(c.url));if(u)im.src=u;else im.removeAttribute("src")});el.append(im);break}
   case"Tabs":{const tabs=Array.isArray(c.tabs)?c.tabs:[],bar=document.createElement("div"),body=document.createElement("div");bar.className="rtabs";
      const show=i=>{[...bar.children].forEach((b,j)=>b.classList.toggle("on",j==i));body.replaceChildren(tabs[i]&&typeof tabs[i].child=="string"?me.node(sf,tabs[i].child,scope):"")};
      tabs.forEach((t,i)=>{const b=document.createElement("button");b.type="button";b.textContent=String(v(t&&t.title)??"");b.onclick=()=>show(i);bar.append(b)});el.append(bar,body);show(0);break}
   case"TextField":{const long=c.variant=="longText",i=document.createElement(long?"textarea":"input");if(long)i.rows=1;i.autocomplete="off";i.placeholder=v(c.placeholder)||"";i.setAttribute("aria-label",v(c.label)||"");
      i.style.cssText="width:100%;min-width:180px;resize:none;max-height:120px;font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)";
      const fit=()=>{if(long){i.style.height="auto";i.style.height=Math.min(i.scrollHeight,120)+"px"}};i.oninput=()=>{me.set(sf,c.value["@path"],i.value);fit()};i.onkeydown=e=>{if(e.key=="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();sf.comps.send&&me.fire(sf,"send",scope)}};
      bind(()=>{const x=v(c.value)??"";if(i.value!==x){i.value=x;fit()}});el.append(i);break}
   case"ChoicePicker":{const s=document.createElement("select");s.className="act";s.style.font="inherit";s.setAttribute("aria-label",v(c.label)||"");
      s.innerHTML=c.options.map(o=>`<option value="${esc(o.value)}">${esc(v(o.label))}</option>`).join("");
      s.onchange=()=>me.set(sf,c.value["@path"],[s.value]);bind(()=>{s.value=(v(c.value)||[])[0]??""});el.append(s);break}
   case"Button":{const b=document.createElement("button");b.className="act"+(c.variant=="primary"?" pri":"");b.type="button";b.append(me.node(sf,c.child,scope).firstChild||"");
      b.onclick=()=>me.fire(sf,cid,scope);el.append(b);break}}
  return el.style.cssText||el.className||el.childNodes.length?el:el},
 fire(sf,cid,scope){const ev=sf.comps[cid].action.event,ctx={};for(const[k,x]of Object.entries(ev.context||{}))ctx[k]=this.val(sf,x,scope);this.onEvent&&this.onEvent(ev.name,ctx,sf)}};
function readFile(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]||"");r.onerror=()=>no(r.error);r.readAsDataURL(f)})}
const chatFile=Object.assign(document.createElement("input"),{type:"file",style:"display:none"});
chatFile.onchange=()=>{const sf=A2ui.surfaces.chat;A2ui.set(sf,"/chat/fileName",chatFile.files[0]?.name||"");A2ui.refresh(sf)};
A2ui.onEvent=async(name,ctx,sf)=>{
  if(name=="send_reply")return Reply.send(ctx);
  if(name=="cancel_reply")return Reply.close();
  if(name=="pick_file"){chatFile.click();return}
  if(name=="open_url"){const u=httpUrl(ctx.url);if(u)window.open(u,"_blank","noopener,noreferrer");return}
  if(name=="reply"){const text=String(ctx.text||"").trim();if(!text)return;const r=await api("/api/chat",{to:sf.to||"grok",text});toast(r.error||r.note||"Sent: "+text.slice(0,60));if(!r.error){A2ui.stick=true;load()}return}
  if(name!="send_chat")return;
  const text=(ctx.text||"").trim(),to=(ctx.to||[])[0],f=chatFile.files[0];if(!text)return;const body={to,text};
  if(f){if(to=="computer"){toast("Files can't be sent to Computer use");return}if(f.size>5*1024*1024){toast("File too large (5 MB max)");return}body.file={name:f.name,data:await readFile(f)}}
  const r=await api("/api/chat",body);if(r.error){toast(r.error);return}
  A2ui.stick=true;{const fd=document.querySelector(".chatfeed");if(fd)fd.scrollTop=fd.scrollHeight}A2ui.set(sf,"/chat/text","");A2ui.set(sf,"/chat/fileName","");chatFile.value="";A2ui.refresh(sf);
  toast(r.to=="todo"?r.note:r.to=="computer"?"Computer use started. "+r.note:r.to=="vibi"?"Sent to Vibi; the reply will appear on the Message board":r.to=="gemini"?"Asked Gemini; the answer will appear here":r.note||"Sent to "+(r.to=="grok"?"Grok Bot":"Claude"));load()};
async function loadChat(){if(!$("#chatHost")){$("#main").innerHTML='<div id="chatHost"></div>';A2ui.process(CHAT_SURFACE);A2ui.mount("chat",$("#chatHost"))}
  A2ui.process(chatMessagesUpdate(await api("/api/messages?hours=72")))}
/* ---- Todo tab: data/todos.jsonl, also written by the voice tools and the Chat tab; polled every 2 s so those show up live.
   The form is built once and only the list is redrawn, and only when it changed, so typing is never interrupted. ---- */
let todoSeq=0;
const todoRow=t=>`<tr><td><input type="checkbox" data-id="${esc(t.id)}" ${t.done?"checked":""} aria-label="${t.done?"Reopen":"Mark done"}: ${esc(t.text)}"></td><td class="tx${t.done?" done":""}">${esc(t.text)}<div class="meta">${esc([t.source,t.done?"done "+t.done_at.slice(0,16):t.created.slice(0,16)].filter(Boolean).join(" · "))}</div></td><td class="x"><button class="act" data-del="${esc(t.id)}">Delete</button></td></tr>`;
function todoShell(){if($("#todos"))return;
  $("#main").innerHTML='<form id="todoForm"><input id="todoText" maxlength="500" autocomplete="off" placeholder="Add a todo…" aria-label="New todo"><button class="act pri">Add</button></form><div id="todos"></div>';
  $("#todoForm").onsubmit=async e=>{e.preventDefault();const i=$("#todoText"),text=i.value.trim();if(text&&await todoOp({op:"add",text}))i.value=""};
  $("#todos").onchange=e=>{const id=e.target.dataset.id;if(id)todoOp({op:e.target.checked?"done":"reopen",id})};
  $("#todos").onclick=e=>{const id=e.target.dataset.del;if(id&&confirm("Delete this todo?"))todoOp({op:"delete",id})}}
async function todoOp(body){const r=await api("/api/todos",body);if(r.error)toast(r.error);const box=$("#todos");if(box)delete box.dataset.v;await loadTodos();return!r.error}
async function loadTodos(){const seq=++todoSeq;todoShell();const r=await api("/api/todos"),box=$("#todos");
  if(tab!="todo"||seq!=todoSeq||!box)return;const v=JSON.stringify(r);if(box.dataset.v==v)return;box.dataset.v=v;
  if(r.error){box.innerHTML=`<div class="empty">${esc(r.error)}</div>`;return}
  const open=r.todos.filter(t=>!t.done).reverse(),done=r.todos.filter(t=>t.done).sort((a,b)=>b.done_at.localeCompare(a.done_at));
  box.innerHTML=(open.length?`<table>${open.map(todoRow).join("")}</table>`:'<div class="empty">No open todos. Add one here, say “add a todo …” to Vibi, or send it from the Chat tab.</div>')+(done.length?`<h2 class="meta">Done (${done.length})</h2><table>${done.map(todoRow).join("")}</table>`:"")}
async function load(){
  document.body.classList.toggle("chat",tab=="chat");
  if(tab=="chat")return loadChat();
  if(tab=="todo")return loadTodos();
  if(tab=="components"){const c=await api("/api/components");$("#main").innerHTML='<div class="grid">'+c.map(x=>`<div class="card"><h3><span><span class="dot ${x.running?"on":""}"></span>${esc(x.name)}</span><span class="meta">${x.running?"running":"stopped"}${x.pid?" · pid "+x.pid:""}</span></h3>
  <div class="meta">${esc(x.detail)}</div>${x.error?`<div class="err">last error: ${esc(x.error)}</div>`:""}${x.key=="board"?`<p><button class="act" onclick="mute(${!x.muted})">${x.muted?"Unmute":"Mute"} board &amp; Mac</button></p>`:""}${x.restart?`<p><button class="act" onclick="restart('${esc(x.restart)}','${esc(x.name)}')">Restart</button></p>`:""}</div>`).join("")+"</div>";return}
  if(tab=="board"){const all=window.boardAll||false,m=await api("/api/messages?hours="+(all?0:48)),bar=`<p class="meta">${all?"All messages":"Last 48 hours"} · <a href="#" onclick="boardAll=!boardAll;load();return false">${all?"Show last 48 hours":"Show all"}</a></p>`;
    if(tab!="board")return;const html=bar+(m.length?'<table><tr><th>Time</th><th>Category</th><th></th><th>Message</th><th>Status</th></tr>'+m.map((r,i)=>`<tr data-i="${i}"><td class="t">${esc(r.time)}</td><td><span class="pill">${esc(r.category)}</span></td><td class="meta">${r.direction=="to"?"→ Vibi":"Vibi →"}</td>
    <td>${esc(r.summary)}${r.body&&r.body!==r.summary?` <button class="act" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">Expand</button><div class="d" hidden style="white-space:pre-wrap;margin-top:6px">${esc(r.body)}</div>`:""}</td>
    <td><span class="pill ${r.status=="failed"?"error":r.status=="done"||r.status=="answered"||r.status=="delivered"||r.status=="sent"?"ok":""}">${esc(r.status)}</span></td></tr>`).join("")+"</table>":'<div class="empty">No messages in this time range. Grok Bot, Claude, phone apps, WhatsApp and job-hunt results show up here.</div>'),box=boardShell();
    if(box.html!==html){Reply.keep(()=>{box.innerHTML=box.html=html;box.querySelectorAll("tr[data-i]").forEach(tr=>{const r=m[tr.dataset.i],t=replyTarget(r,r.body||r.summary);if(t){Reply.attach(tr,t);tr.children[3].append(" ",Reply.button(t))}})})}else if(Reply.target)Reply.keep(()=>{});return}
  const rows=await api("/api/history?kind="+tab);
  $("#main").innerHTML=rows.length?`<table><tr><th>Time</th><th>${tab=="actions"?"Action":"Entry"}</th><th>Status</th><th>Result</th><th></th></tr>`+rows.map(r=>`<tr><td class="t">${esc(r.time)}</td>
  <td>${esc(r.title)}${r.risky?' <span class="pill warn">asks first</span>':""}${r.source?`<div class="meta">${esc(r.source)}</div>`:""}</td><td><span class="pill ${r.status=="error"?"error":r.status=="ok"||r.status=="done"?"ok":""}">${esc(r.status)}</span></td>
  <td class="d">${esc(r.detail)}</td><td>${r.rerun?`<button class="act" onclick="rerun('${esc(r.id)}',${r.risky})">Rerun</button>`:""}</td></tr>`).join("")+"</table>":'<div class="empty">Nothing yet. New voice requests show up here.</div>'}
async function rerun(id,risky){if(risky&&!confirm("This is a risky kind of action. Vibi will speak the details and wait for your spoken yes before doing anything. Continue?"))return;const r=await api("/api/rerun",{kind:tab,id});toast(r.note||r.error)}
async function mute(on){await api("/api/mute",{on});toast(on?"Muted: board and Mac are off":"Unmuted");load()}
async function restart(k,n){if(!confirm("Restart "+n+"?"))return;const r=await api("/api/restart",{key:k});toast(r.ok?(r.note||n+" restarting"):"Failed: "+r.error);setTimeout(load,3000)}
async function loadStealth(){const r=await api("/api/stealth");$("#stealth").checked=!!r.on}
async function setStealth(on){const r=await api("/api/stealth",{on});toast(on?"Stealth on: no mic, no voice. Type commands in the Chat tab.":"Stealth off");$("#stealth").checked=!!r.on}
async function loadStyle(){const s=await api("/api/style");$("#style").innerHTML=s.styles.map(x=>`<option ${x==s.style?"selected":""}>${x}</option>`).join("")}
async function setStyle(v){const r=await api("/api/style",{style:v});toast("Voice style: "+r.style+(r.error?" ("+r.error+")":""))}
nav();loadStyle();loadStealth();load();timer=setInterval(()=>{if(!document.hidden&&tab!="todo")load()},5000);setInterval(()=>{if(!document.hidden&&tab=="todo")loadTodos()},2000);
</script></body></html>
