# Install the server with Docker

version: '3'
services:
  xiaozhi-esp32-server:
    image: ghcr.io/xinnan-tech/xiaozhi-esp32-server:server_latest
    container_name: xiaozhi-esp32-server
    restart: always
    security_opt:
      - seccomp:unconfined
    environment:
      - TZ=UTC
    ports:
      # ws server
      - "8000:8000"
      # port of the http service, used for the simple OTA endpoint (single-service deployment) and the vision analysis endpoint
      - "8003:8003"
    volumes:
      # configuration file directory
      - ./data:/opt/xiaozhi-esp32-server/data
