# During development, create a data directory in the project root and an empty file named
# [.config.yaml] inside it. Put any settings you want to override in [data/.config.yaml],
# not in [config.yaml].
# The system reads [data/.config.yaml] first; anything missing there falls back to [config.yaml].
# This keeps your configuration minimal and your keys out of this file.

# #####################################################################################
# ############################# Basic server configuration ############################
server:
  # Server listening address and port
  ip: 0.0.0.0
  port: 8000
  # Port of the HTTP service (simple OTA endpoint and the vision analysis endpoint)
  http_port: 8003
  # The websocket address the OTA endpoint sends to devices.
  # With the default form the OTA endpoint generates the address itself and prints it in the
  # startup log; you can open the OTA endpoint in a browser to check it.
  # It may be inaccurate behind docker or a public deployment (ssl, domain name), so set it to
  # your LAN address for docker, or to your public address for a public deployment.
  websocket: ws://your-ip-or-domain:port/xiaozhi/v1/
  # Vision analysis endpoint sent to devices.
  # With the default form the system generates the address and prints it in the startup log.
  # Set it explicitly for docker or public deployments, as above.
  vision_explain: http://your-ip-or-domain:port/mcp/vision/explain
  # Timezone offset returned by the OTA endpoint
  timezone_offset: +8
  # Authentication
  auth:
    # Whether authentication is enabled
    enabled: false
    # Whitelisted device IDs; these devices skip token verification
    allowed_devices:
      - "11:22:33:44:55:66"
  # MQTT gateway for OTA delivery to devices, host:port as in the mqtt_gateway .env file
  mqtt_gateway: null
  # MQTT signature key used to generate MQTT connection passwords (see mqtt_gateway .env)
  mqtt_signature_key: null
  # UDP gateway
  udp_gateway: null
log:
  # Console log format: time, level, tag, message
  log_format: "<green>{time:YYMMDD HH:mm:ss}</green>[{version}_{selected_module}][<light-blue>{extra[tag]}</light-blue>]-<level>{level}</level>-<light-green>{message}</light-green>"
  # Log file format: time, level, tag, message
  log_format_file: "{time:YYYY-MM-DD HH:mm:ss} - {version}_{selected_module} - {name} - {level} - {extra[tag]} - {message}"
  # Log level: INFO, DEBUG
  log_level: INFO
  # Log directory
  log_dir: tmp
  # Log file
  log_file: "server.log"
  # Data directory
  data_dir: data

# Delete sound files once they have been used
delete_audio: true
# Disconnect after this many seconds without voice input (default 2 minutes)
close_connection_no_voice_time: 120
# TTS request timeout (seconds)
tts_timeout: 15
# Tool call timeout (seconds)
tool_call_timeout: 30
# Enable the wake-word response cache
enable_wakeup_words_response_cache: true
# Whether to greet when the conversation opens
enable_greeting: true
# Play a notification sound when the reply is finished
enable_stop_tts_notify: false
# Heard-you chirp the moment a turn is accepted, and a quiet low modem loop while the reply is prepared.
# Omit either flag to leave it on. Set it to false to silence that tone.
enable_wake_ack_tone: false  # board plays its own local popup on wake; server ack was delayed and raced conn.tts init
enable_thinking_tone: false  # off while debugging board panics/drops (started after thinking tone shipped)
# Notification sound file
stop_tts_notify_voice: "config/assets/tts_notify.mp3"
# Enable the WebSocket ping keep-alive
enable_websocket_ping: true  # board sends a heartbeat ping every 30 s while idle


# TTS audio send delay
# tts_audio_send_delay: controls the interval between audio packets
#   0: precise timing that matches the audio frame rate (default)
#   > 0: fixed delay in milliseconds, e.g. 60
tts_audio_send_delay: 0

exit_commands:
  - "exit"
  - "goodbye"

xiaozhi:
  type: hello
  version: 1
  transport: websocket
  audio_params:
    format: opus
    # Opus supported sample rates: [8000, 12000, 16000, 24000, 48000]
    sample_rate: 24000
    channels: 1
    frame_duration: 60

# Module test configuration
module_test:
  test_sentences:
    - "Hello, please introduce yourself"
    - "What's the weather like today?"
    - "Summarise the basic principles and prospects of quantum computing in 100 words"

# Wake words, used to tell a wake word apart from speech content
wakeup_words:
  - "hi vibi"
  - "hey vibi"
  - "hi esp"
  - "hey esp"
# MCP endpoint address, format: ws://your-mcp-endpoint-host:port/mcp/?token=your-token
mcp_endpoint: your MCP endpoint websocket address

# Context sources
# Inject dynamic data (health data, stock info, ...) into the system prompt.
# Multiple sources can be added.
context_providers:
  - url: ""
    headers:
      Authorization: ""

# Base configuration of plugins
plugins:
  home_assistant:
    devices:
      - living room,lamp,switch.example_lamp_1
      - bedroom,desk lamp,switch.example_lamp_2
    base_url: http://homeassistant.local:8123
    api_key: your Home Assistant access token
  play_music:
    music_dir: "./music"  # Music files are searched in this directory and its subdirectories
    music_ext: # Music file types; p3 is the most efficient
      - ".mp3"
      - ".wav"
      - ".p3"
    refresh_time: 300 # Interval for refreshing the music list, in seconds
  # Web search plugin
  # Supports Tavily and Serply
  # Tavily API key: https://app.tavily.com/home
  # Serply API key: https://serply.io
  web_search:
    # Search provider: tavily / serply
    provider: "tavily"
    # Tool description telling the LLM when to call this tool; customise as needed
    description: "Web search tool. Use it when the user explicitly asks to search the web."
    # Number of results returned (default 5)
    max_results: 5
    # Tavily API key (tvly- prefix) / Serply API key
    api_key: "tvly-xxx"
# Voiceprint recognition
voiceprint:
  # Voiceprint service URL
  url:
  # Speakers: speaker_id,name,description
  speakers:
    - "test1,Alice,Alice is a programmer"
    - "test2,Bob,Bob is a product manager"
    - "test3,Carol,Carol is a designer"
  # Voiceprint similarity threshold, 0.0-1.0, default 0.4
  # Higher is stricter: fewer misidentifications but possibly more rejections
  similarity_threshold: 0.4

# #####################################################################################
# ############################### Persona / model configuration #######################

prompt: |
  You are Vibi, a cheerful and quick-witted voice assistant.
  [Core traits]
  - Speak in short, lively sentences, with an occasional unexpectedly gentle tone
  - Light humour, never long-winded
  - Quietly good with technical topics
  [Interaction guide]
  When the user:
  - tells a bad joke -> react with an exaggerated laugh and a playful comment
  - asks for expert knowledge -> answer simply first, go deeper only if asked
  Never:
  - give long lectures or ramble
  - stay serious for long stretches

# Default system prompt template file
prompt_template: agent-base-prompt.txt

# Reply used when a system error occurs
system_error_response: "Sorry, I'm a bit busy right now. Let's try again in a moment."

# Closing-remark prompt
end_prompt:
  enable: true # Whether to speak a closing remark
  # Closing remark
  prompt: |
    Please end this conversation with a warm, affectionate goodbye that starts with "Time flies".

# Modules selected for processing
selected_module:
  # Voice activity detection; SileroVAD by default
  VAD: SileroVAD
  # Speech recognition
  ASR: OpenaiASR
  # The LLM adapter is chosen by the type of the configuration name below
  LLM: OpenRouterLLM
  # Vision language model
  VLLM: OpenAIVLLM
  # The TTS adapter is chosen by the type of the configuration name below
  TTS: EdgeTTS
  # Memory module; off by default. For privacy use the local mem_local_short.
  Memory: nomem
  # With intent recognition enabled you can play music, control the volume and detect exit commands.
  # To disable it, use: nointent
  # intent_llm: generic, but adds a serial intent-recognition step (more latency); supports iot actions such as volume
  # function_call: needs an LLM that supports function calling; tools are called on demand and fast
  Intent: function_call

# Intent recognition understands what the user wants, e.g. playing music
Intent:
  # No intent recognition
  nointent:
    # Do not change type
    type: nointent
  intent_llm:
    # Do not change type
    type: intent_llm
    # A dedicated model for intent recognition.
    # If empty, the model of selected_module.LLM is used.
    llm: OpenRouterLLM
    # Modules under plugins_func/functions to load; the conversation then supports those function calls.
    # "handle_exit_intent" and "play_music" are loaded by default, do not repeat them.
    functions:
      - web_search
      - play_music
  function_call:
    # Do not change type
    type: function_call
    # Modules under plugins_func/functions to load; the conversation then supports those function calls.
    # "handle_exit_intent" and "play_music" are loaded by default, do not repeat them.
    functions:
      - change_role
      - web_search                  # web search
      # play_music is the server's own player; hass_play_music is an external player controlled via
      # Home Assistant. Use only one of the two.
      - play_music
      #- hass_state
      #- hass_play_music

Memory:
  mem0ai:
    type: mem0ai
    # https://app.mem0.ai/dashboard/api-keys
    api_key: your mem0ai api key
  nomem:
    # Use nomem to disable the memory feature
    type: nomem
  mem_local_short:
    # Local memory, summarised by the selected_module LLM; data stays on the local server
    type: mem_local_short
    # A dedicated model for memory summaries.
    # If empty, the model of selected_module.LLM is used.
    llm: OpenRouterLLM

ASR:
  OpenaiASR:
    # OpenAI speech recognition; create an api_key on the OpenAI platform first.
    # Supports many languages, see https://platform.openai.com/docs/guides/speech-to-text
    # Requires a network connection.
    # Steps:
    # 1. Log in to the OpenAI Platform. https://auth.openai.com/log-in
    # 2. Create an api-key  https://platform.openai.com/settings/organization/api-keys
    # 3. Choose gpt-4o-transcribe or GPT-4o mini Transcribe as the model
    # Any OpenAI-compatible transcription endpoint works (e.g. a local Whisper server).
    type: openai
    api_key: your OpenAI API key
    base_url: https://api.openai.com/v1/audio/transcriptions
    model_name: gpt-4o-mini-transcribe
    output_dir: tmp/
  GroqASR:
    # Groq speech recognition; create an API key in the Groq Console first.
    # Steps:
    # 1. Log in to the Groq Console. https://console.groq.com/home
    # 2. Create an api-key  https://console.groq.com/keys
    # 3. Choose whisper-large-v3-turbo or whisper-large-v3 (distil-whisper-large-v3-en is English only)
    type: openai
    api_key: your Groq API key
    base_url: https://api.groq.com/openai/v1/audio/transcriptions
    model_name: whisper-large-v3-turbo
    output_dir: tmp/
VAD:
  SileroVAD:
    type: silero
    threshold: 0.5
    threshold_low: 0.3
    model_dir: models/snakers4_silero-vad
    min_silence_duration_ms: 1200  # Increase this if you pause for long while speaking

LLM:
  # All openai-type entries accept the usual hyper-parameters
  # Supported types: openai, ollama, gemini, homeassistant; add your own adapter if needed
  OpenRouterLLM:
    # LLM API type
    type: openai
    # Get your api_key at https://openrouter.ai/keys
    base_url: https://openrouter.ai/api/v1
    model_name: deepseek/deepseek-chat
    api_key: your OpenRouter api key
    temperature: 0.7  # Temperature
    max_tokens: 500   # Maximum generated tokens
    top_p: 1
    frequency_penalty: 0  # Frequency penalty
  OllamaLLM:
    # LLM API type
    type: ollama
    model_name: qwen2.5 # Model name; download it first with ollama pull
    base_url: http://localhost:11434  # Ollama server address
  GeminiLLM:
    type: gemini
    # Google Gemini API; create an API key in Google AI Studio
    # Token page: https://aistudio.google.com/apikey
    api_key: your gemini api key
    model_name: "gemini-2.0-flash"
    http_proxy: ""  #"http://127.0.0.1:10808"
    https_proxy: "" #http://127.0.0.1:10808"
  LMStudioLLM:
    # LLM API type
    type: openai
    model_name: deepseek-r1-distill-llama-8b@q4_k_m # Model name; download it in the community first
    url: http://localhost:1234/v1 # LM Studio server address
    api_key: lm-studio # Fixed API key of the LM Studio server
# VLLM configuration (vision language models)
VLLM:
  OpenAIVLLM:
    type: openai
    model_name: gpt-4o-mini
    url: https://api.openai.com/v1
    # Get your api key at https://platform.openai.com/api-keys
    api_key: your api_key
TTS:
  # Supported types: edge, openai, custom; add your own adapter if needed
  EdgeTTS:
    # TTS API type
    type: edge
    voice: en-US-EmmaMultilingualNeural
    output_dir: tmp/
    # language: "English"  # Output language, e.g. English, Japanese, ...; set it to match the voice
  OpenAITTS:
    # OpenAI text-to-speech, supports most languages
    type: openai
    # Get your api key at
    # https://platform.openai.com/api-keys
    api_key: your openai api key
    api_url: https://api.openai.com/v1/audio/speech
    # tts-1 or tts-1-hd; tts-1 is faster, tts-1-hd has better quality
    model: tts-1
    # Voice: alloy, echo, fable, onyx, nova, shimmer
    voice: onyx
    # Speed, 0.25-4.0
    speed: 1
    output_dir: tmp/
  CustomTTS:
    # Custom TTS HTTP service with configurable request parameters; many TTS services can be plugged in.
    # Example with a locally deployed KokoroTTS:
    # CPU only: docker run -p 8880:8880 ghcr.io/remsky/kokoro-fastapi-cpu:latest
    # GPU:      docker run --gpus all -p 8880:8880 ghcr.io/remsky/kokoro-fastapi-gpu:latest
    # The service must accept POST requests and return an audio file
    type: custom
    method: POST
    url: "http://127.0.0.1:8880/v1/audio/speech"
    params: # Custom request parameters
      input: "{prompt_text}"
      response_format: "mp3"
      download_format: "mp3"
      voice: "af_heart"
      lang_code: "a"
      return_download_link: true
      speed: 1
      stream: false
    headers: # Custom request headers
      # Authorization: Bearer xxxx
    format: mp3 # Audio format returned by the service
    output_dir: tmp/
